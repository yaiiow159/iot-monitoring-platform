services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: iot-timescaledb
    environment:
      POSTGRES_DB: iotmon
      POSTGRES_USER: iotmon
      POSTGRES_PASSWORD: iotmon
      # 每秒五萬筆寫入下，預設的 shared_buffers 會讓 checkpoint 變成尖峰來源
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=15min
      # 連續聚合、壓縮與保留政策各自需要一個背景工作者
      - -c
      - timescaledb.max_background_workers=16
      - -c
      - max_worker_processes=32
      - -c
      - max_parallel_workers=8
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iotmon -d iotmon"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  emqx:
    image: emqx/emqx:5.8.2
    container_name: iot-emqx
    environment:
      EMQX_NODE__NAME: emqx@127.0.0.1
      EMQX_NODE__COOKIE: iotmon
      # 一萬台裝置各持一條長連線，預設上限擋得住但沒有餘裕
      EMQX_LISTENERS__TCP__DEFAULT__MAX_CONNECTIONS: "50000"
      EMQX_DASHBOARD__DEFAULT_PASSWORD: "iotmon2026"
    ports:
      - "1883:1883"   # MQTT
      - "8083:8083"   # MQTT over WebSocket
      - "18083:18083" # Dashboard
    volumes:
      - emqx_data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  kafka:
    image: apache/kafka:3.8.1
    container_name: iot-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12
      # 遙測是可以丟的：積壓時寧可讓推播消費端跳過，也不要把磁碟寫爆
      KAFKA_LOG_RETENTION_HOURS: 6
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: iot-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d

  grafana:
    image: grafana/grafana:11.3.1
    container_name: iot-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: iotmon
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  timescale_data:
  emqx_data:
  kafka_data:
  grafana_data:
